# OILTRACE — Render Blueprint (deploys backend + frontend from this repo).
#
# Deploy: Render dashboard -> New + -> Blueprint -> connect this GitHub repo ->
# Apply. See DEPLOY.md for the full flow.
#
# Architecture: separate domains. The frontend (Next.js) calls the backend
# (FastAPI in Docker) directly at NEXT_PUBLIC_API_URL; the backend allows the
# frontend origin via ALLOWED_ORIGINS (explicit CORS, no wildcard).
#
# The two URL variables are intentionally left unset (sync: false) because of
# the deploy ordering (backend URL must exist before the frontend is built with
# it; the frontend URL must exist before the backend allows its origin):
#   1. Apply the blueprint; both services get URLs.
#   2. Set oiltrace-web NEXT_PUBLIC_API_URL = the oiltrace-api URL, redeploy web.
#   3. Set oiltrace-api ALLOWED_ORIGINS = the oiltrace-web URL.
#
# Render's free plan idles services (cold starts). Fine for a demo.

services:
  # --- Backend: FastAPI in Docker (rasterio/opencv/GDAL native deps) ---------
  - type: web
    name: oiltrace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Comma-separated frontend origin(s), e.g. https://oiltrace-web.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

  # --- Frontend: Next.js (calls the backend cross-origin) --------------------
  - type: web
    name: oiltrace-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Backend base URL (full https:// URL), e.g. https://oiltrace-api.onrender.com
      # Build time only: after setting this, redeploy the web service.
      - key: NEXT_PUBLIC_API_URL
        sync: false
